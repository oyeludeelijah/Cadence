<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Cadence — Stay On Track With AI-Powered Checkpoints</title>
    <meta name="description" content="Cadence breaks your assignments into timed, AI-generated checkpoints so you always know exactly what to do next. Stop procrastinating. Start finishing." />
    <meta name="theme-color" content="#E07A4A" />

    <!-- Fonts — preconnect first, then load only what we use -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-FOUC: set theme attribute synchronously before first paint -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme')
        // Default: light. Only go dark if OS explicitly prefers dark.
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', saved || preferred)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
